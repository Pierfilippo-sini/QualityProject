<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/login">
  <title>B2B Scouting Agent - Accesso</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #0f172a; text-align: center; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); max-width: 420px; }
    a { color: #2563eb; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reindirizzamento a B2B Scouting Agent...</h2>
    <p>Se non vieni reindirizzato automaticamente, clicca qui:</p>
    <p><a href="http://localhost:3000/login">http://localhost:3000/login</a></p>
    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 1.5rem 0;">
    <p style="font-size: 0.85rem; color: #64748b;">
      Nota: il server locale deve essere avviato. Puoi fare doppio clic su <code>AVVIA_APP.command</code> o eseguire <code>npm run dev</code> da terminale.
    </p>
  </div>
</body>
</html>
